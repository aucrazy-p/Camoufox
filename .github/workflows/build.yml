name: 构建 Windows 控制端

# 只手动触发。刻意不配 push / pull_request / schedule：
# 任何一次构建都必须由人在 Actions 页面点「Run workflow」发起。
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: '内嵌 Python 版本（embeddable，主次版本需为 3.13）'
        required: true
        default: '3.13.14'
        type: string
      keep_artifact:
        description: '把构建产物存为 artifact（保留 90 天）'
        required: false
        default: true
        type: boolean
      publish_release:
        description: '【对外发布】发布/更新 Release：runtime-v1 运行时包 + app-latest 控制端 exe（默认关闭）'
        required: false
        default: false
        type: boolean

# 写权限只在 publish_release=true 那个步骤里才会被用到；默认构建全程只读。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # windows runner 的控制台默认 cp1252，脚本里大量中文 print 会直接
    # UnicodeEncodeError 崩溃（2026-11-10 首跑实锤）。强制 UTF-8 输出。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: 安装构建工具
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: 重建内嵌运行时
        shell: pwsh
        env:
          FP_PY_VERSION: ${{ inputs.python_version }}
        run: python _tools/prepare_runtime.py --version $env:FP_PY_VERSION

      # 一次 build.py 同时产出：管理端 exe + runtime-extra-v1.zip + .sha256
      - name: 打包 exe 与浏览器运行时包
        shell: pwsh
        run: |
          $env:FP_BUILD_PY = (Get-Command python).Source
          python _tools/build.py

      - name: 核对三个产物
        shell: pwsh
        run: |
          $want = @(
            'dist/指纹环境管理器.exe',
            'dist/runtime-extra-v1.zip',
            'dist/runtime-extra-v1.zip.sha256'
          )
          foreach ($f in $want) {
            if (-not (Test-Path $f)) { throw "缺少产物: $f" }
            $i = Get-Item $f
            '{0}  {1:N1} MB' -f $i.Name, ($i.Length / 1MB)
          }
          $sha = (Get-Content 'dist/runtime-extra-v1.zip.sha256' -Raw).Trim().Split()[0]
          $got = (Get-FileHash 'dist/runtime-extra-v1.zip' -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $got) { throw '运行时包 SHA256 校验失败' }
          'SHA256 一致: ' + $got

      - name: 上传构建产物
        if: ${{ inputs.keep_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: 指纹环境管理器
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

      # 只有手动勾选 publish_release 才会执行。绝不自动建 Release。
      # runtime-v1 tag 与 app/common.py 的 RUNTIME_TAG、_tools/build.py 的 RUNTIME_TAG 必须一致。
      # app-latest 是固定 tag：每次发布覆盖 exe 资产，下载地址永远不变。
      - name: 发布浏览器运行时包与控制端 exe 到 Release（已勾选）
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # gh release view 在 Release 不存在时会以非零码退出；
          # pwsh 7.3+ 默认会把它当错误抛出，显式关掉才能用 $LASTEXITCODE 判断。
          $ErrorActionPreference = 'continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # ---------- 1. 浏览器运行时包 → runtime-v1 ----------
          $tag  = 'runtime-v1'
          $zip  = 'dist/runtime-extra-v1.zip'
          $sha  = 'dist/runtime-extra-v1.zip.sha256'
          gh release view $tag --json tagName | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            # --clobber 覆盖同名资产：依赖升级后重发同一个 tag，程序下载地址不变
            gh release upload $tag $zip $sha --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传运行时包失败' }
          } else {
            gh release create $tag --title "浏览器运行时 $tag" `
              --notes "由手动构建生成，供控制端首次启动按需下载。此 Release 只含浏览器运行时包，不含浏览器内核，也不含账号数据。" `
              $zip $sha
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
          }
          gh release view $tag --json assets --jq '.assets[].name'

          # ---------- 2. 控制端 exe → app-latest（固定 tag，永久可下载） ----------
          $ver = (Select-String -Path 'app/common.py' -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $ver) { throw 'app/common.py 里读不到 VERSION' }
          $exeTag = 'app-latest'
          $exe = 'dist/指纹环境管理器.exe'
          $notes = "控制端 exe v$ver（手动构建）。运行时包与内核首次启动在界面内按需下载。"
          gh release view $exeTag --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $exeTag $exe --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传 exe 失败' }
            gh release edit $exeTag --title "控制端 exe（v$ver）" --notes $notes | Out-Null
          } else {
            gh release create $exeTag --title "控制端 exe（v$ver）" --notes $notes $exe
            if ($LASTEXITCODE -ne 0) { throw '创建 exe Release 失败' }
          }
          gh release view $exeTag --json assets --jq '.assets[].name'

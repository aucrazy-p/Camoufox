name: 构建 Windows 控制端

# 只手动触发。刻意不配 push / pull_request / schedule：
# 任何一次构建都必须由人在 Actions 页面点「Run workflow」发起。
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: '内嵌 Python 版本（embeddable，主次版本需为 3.13）'
        required: true
        default: '3.13.14'
        type: string
      keep_artifact:
        description: '把 exe 存为构建产物（保留 90 天）'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: 安装构建工具
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: 重建内嵌运行时
        shell: pwsh
        env:
          FP_PY_VERSION: ${{ inputs.python_version }}
        run: python _tools/prepare_runtime.py --version $env:FP_PY_VERSION

      - name: 打包单文件 exe
        shell: pwsh
        run: |
          $env:FP_BUILD_PY = (Get-Command python).Source
          python _tools/build.py

      - name: 核对产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw '未生成 exe' }
          '{0}  {1:N1} MB' -f $exe.Name, ($exe.Length / 1MB)

      # 只存构建产物，不自动创建 Release、不自动发布。
      - name: 上传构建产物
        if: ${{ inputs.keep_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: 指纹环境管理器
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90
